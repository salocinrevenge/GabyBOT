<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GabyBOT - Interface Local</title>
    <style>
        :root {
            --bg-main: #131314;
            --bg-surface: #1e1f20;
            --bg-user: #282a2c;
            --text-primary: #e3e3e3;
            --text-secondary: #a8c7fa;
            --border-color: #333537;
            --accent: #8ab4f8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            padding: 14px 24px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            scroll-behavior: smooth;
        }
        .message {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .user-msg {
            background: var(--bg-user);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-msg {
            background: transparent;
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }
        .thought-box {
            background: #18191a;
            border-left: 3px solid #666;
            padding: 8px 12px;
            margin-bottom: 10px;
            font-size: 0.88rem;
            color: #9aa0a6;
            border-radius: 4px;
        }
        .tool-badge {
            display: inline-block;
            background: #25282c;
            color: var(--text-secondary);
            font-family: monospace;
            font-size: 0.82rem;
            padding: 4px 8px;
            border-radius: 6px;
            margin: 4px 0;
        }
        .attachments-preview {
            max-width: 820px;
            width: 100%;
            margin: 0 auto 8px auto;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chip {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip button {
            background: none;
            border: none;
            color: #f28b82;
            cursor: pointer;
            font-weight: bold;
        }
        #input-area {
            background: var(--bg-main);
            padding: 12px 24px 20px 24px;
            border-top: 1px solid var(--border-color);
        }
        .input-box {
            max-width: 820px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            resize: none;
            font-size: 1rem;
            outline: none;
            max-height: 200px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background: var(--accent);
            color: #131314;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        #drop-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(19, 19, 20, 0.88);
            border: 3px dashed var(--accent);
            z-index: 999;
            justify-content: center;
            align-items: center;
            font-size: 1.4rem;
            color: var(--accent);
        }
        .generated-img {
            max-width: 100%;
            max-height: 480px;
            border-radius: 10px;
            margin-top: 10px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            display: block;
        }
    </style>
</head>
<body>
    <div id="drop-overlay">Solte os arquivos aqui para anexar ao prompt</div>

    <header>
        <h1>GabyBOT • Chat Local</h1>
        <button class="btn-secondary" onclick="clearHistory()">Limpar Conversa</button>
    </header>

    <div id="chat-container"></div>

    <div id="input-area">
        <div class="attachments-preview" id="attachments-list"></div>
        <div class="input-box">
            <textarea id="prompt-input" rows="2" placeholder="Digite sua mensagem, cole (Ctrl+V) uma imagem/código ou arraste arquivos..."></textarea>
            <div class="controls">
                <div>
                    <input type="file" id="file-picker" multiple hidden>
                    <button class="btn-secondary" onclick="document.getElementById('file-picker').click()">+ Anexar Arquivo</button>
                </div>
                <button class="btn" id="send-btn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const promptInput = document.getElementById('prompt-input');
        const attachmentsList = document.getElementById('attachments-list');
        const sendBtn = document.getElementById('send-btn');
        const dropOverlay = document.getElementById('drop-overlay');
        let attachedFiles = [];

        // Drag & Drop global
        window.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropOverlay.style.display = 'flex';
        });
        window.addEventListener('dragleave', (e) => {
            if (e.target === dropOverlay) dropOverlay.style.display = 'none';
        });
        window.addEventListener('drop', (e) => {
            e.preventDefault();
            dropOverlay.style.display = 'none';
            if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
        });

        // Ctrl+V (Imagens e arquivos da área de transferência)
        promptInput.addEventListener('paste', (e) => {
            const items = e.clipboardData?.items;
            if (!items) return;
            const files = [];
            for (const item of items) {
                if (item.kind === 'file') {
                    const file = item.getAsFile();
                    if (file) files.push(file);
                }
            }
            if (files.length > 0) addFiles(files);
        });

        document.getElementById('file-picker').addEventListener('change', (e) => {
            addFiles(e.target.files);
            e.target.value = '';
        });

        function addFiles(fileList) {
            for (const f of fileList) attachedFiles.push(f);
            renderAttachments();
        }

        function removeFile(idx) {
            attachedFiles.splice(idx, 1);
            renderAttachments();
        }

        function renderAttachments() {
            attachmentsList.innerHTML = attachedFiles.map((f, i) => `
                <div class="chip">
                    <span>📎 ${f.name || 'imagem_colada.png'}</span>
                    <button onclick="removeFile(${i})">×</button>
                </div>
            `).join('');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        promptInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = promptInput.value.trim();
            if (!text && attachedFiles.length === 0) return;

            sendBtn.disabled = true;
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const filesLabel = attachedFiles.length ? `\n[Anexos: ${attachedFiles.map(f => f.name).join(', ')}]` : '';
            userDiv.textContent = text + filesLabel;
            chatContainer.appendChild(userDiv);
            scrollToBottom();

            const formData = new FormData();
            formData.append('prompt', text);
            attachedFiles.forEach(f => formData.append('files', f, f.name || 'colado.png'));

            promptInput.value = '';
            attachedFiles = [];
            renderAttachments();

            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-msg';
            const thoughtDiv = document.createElement('div');
            thoughtDiv.className = 'thought-box';
            thoughtDiv.style.display = 'none';
            const toolsDiv = document.createElement('div');
            const mediaDiv = document.createElement('div');
            const contentDiv = document.createElement('div');

            botDiv.appendChild(thoughtDiv);
            botDiv.appendChild(toolsDiv);
            botDiv.appendChild(mediaDiv);
            botDiv.appendChild(contentDiv);
            chatContainer.appendChild(botDiv);
            scrollToBottom();

            try {
                const response = await fetch('/chat_stream', { method: 'POST', body: formData });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.slice(6));

                        if (data.type === 'thinking') {
                            thoughtDiv.style.display = 'block';
                            thoughtDiv.textContent += data.content;
                        } else if (data.type === 'tool') {
                            const badge = document.createElement('div');
                            badge.className = 'tool-badge';
                            badge.textContent = `🔧 ${data.content}`;
                            toolsDiv.appendChild(badge);
                        } else if (data.type === 'content') {
                            contentDiv.textContent += data.content;
                        } else if (data.type === 'error') {
                            contentDiv.textContent += `\n❌ Erro: ${data.content}`;
                        } else if (data.type === 'image') {
                            const img = document.createElement('img');
                            img.src = data.url;
                            img.className = 'generated-img';
                            img.title = 'Clique para abrir em tamanho original';
                            img.onclick = () => window.open(data.url, '_blank');
                            mediaDiv.appendChild(img);
                        }
                        scrollToBottom();
                    }
                }
            } catch (err) {
                contentDiv.textContent = `Erro de conexão com o servidor: ${err}`;
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        async function clearHistory() {
            await fetch('/clear', { method: 'POST' });
            chatContainer.innerHTML = '';
        }
    </script>
</body>
</html>
